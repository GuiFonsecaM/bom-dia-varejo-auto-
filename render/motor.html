<title>Motor 3D Bom dia varejo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,500;1,600;1,700&display=swap">
<style>
/* Layout: palco 9:16 (o vídeo) centralizado e controles de revisão embaixo. Em modo render, o palco ocupa a janela inteira. */
:root{
  --bg:#0e1013;--surface:#171a1f;--line:#2a2f37;--fg:#f4f1ea;--muted:#959ca6;
  --accent:#ff7a00;--accent-soft:rgba(242,140,27,.16);
  --font:"Segoe UI","Open Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font)}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:relative;width:min(100%,calc((100vh - 190px)*9/16));width:min(100%,calc((100dvh - 190px)*9/16));
  min-width:min(100%,250px);aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#000;container-type:inline-size}
body.render{background:#000}
body.render .wrap{padding:0;gap:0}
body.render .stage{width:100vw;height:100vh;max-width:none;min-width:0;border-radius:0}
body.render .progress,body.render .ctrl,body.render .note{display:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.18) 16%,rgba(0,0,0,.24) 26%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 62%,rgba(0,0,0,.3) 72%,rgba(0,0,0,.08) 80%,rgba(0,0,0,.35) 100%)}
.brand{position:absolute;top:4.2cqw;right:4.2cqw;display:flex;align-items:center;gap:2cqw;font-weight:800;font-size:4.1cqw;letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.brand img{width:8.4cqw;height:8.4cqw;border-radius:50%;display:block}
.hud{position:absolute;left:5.6cqw;right:5.6cqw;top:30cqw;display:flex;flex-direction:column;gap:.9cqw;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.eyebrow{font-size:2.4cqw;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.big{font-size:10cqw;line-height:.95;font-weight:800;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;transform-origin:left center}
.sub{font-size:2.2cqw;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
.ticks{display:flex;gap:1cqw;margin-top:1.3cqw;flex-wrap:wrap;max-width:70cqw}
.ticks i{display:block;width:3.4cqw;height:.6cqw;border-radius:1cqw;background:rgba(255,255,255,.28)}
.ticks i.done{background:rgba(255,255,255,.75)}
.ticks i.on{background:var(--accent)}
.cap{position:absolute;left:8cqw;right:8cqw;top:122cqw;margin:0;text-align:center;font-style:italic;font-weight:600;font-size:4cqw;line-height:1.3;text-wrap:balance;}
.cap .w{opacity:0;display:inline-block;transform:translateY(1cqw);transition:opacity .18s ease,transform .18s ease}
.cap .w.on{opacity:1;transform:none}
.cap .w.off{display:none}
.cap .hl{color:var(--accent);font-weight:700;font-size:1.08em}
body.render .cap .w{transition:none}
.src{position:absolute;left:5.6cqw;bottom:24cqw;margin:0;font-size:2.3cqw;font-weight:600;color:rgba(244,241,234,.78);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.dip{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;background:rgba(12,13,16,.72);opacity:0;pointer-events:none;text-align:center;padding:0 8cqw}
.end img{width:22cqw;height:22cqw;border-radius:50%;display:block}
.end b{font-size:8cqw;font-weight:800;letter-spacing:-.02em}
.end span{font-size:3.8cqw;color:rgba(244,241,234,.85);font-style:italic}
.progress{width:min(100%,calc((100dvh - 190px)*9/16));min-width:min(100%,250px);height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent)}
.ctrl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:620px}
.ctrl button{font:600 13px/1 var(--font);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.ctrl button:hover{border-color:#3b414b}
.ctrl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctrl .chip{color:var(--muted)}
.ctrl .chip.cur{color:var(--fg);border-color:var(--accent)}
.ctrl .sep{flex-basis:100%;height:0}
.note{font-size:12px;color:var(--muted);max-width:56ch;text-align:center;line-height:1.5;margin:0}
</style>

const PT_EN={'estados unidos':'United States of America','eua':'United States of America','reino unido':'United Kingdom','russia':'Russia','ucrania':'Ukraine','arabia saudita':'Saudi Arabia','iemen':'Yemen','ira':'Iran','iraque':'Iraq','israel':'Israel','palestina':'Palestine','gaza':'Palestine','cisjordania':'Palestine','libano':'Lebanon','siria':'Syria','turquia':'Turkey','egito':'Egypt','franca':'France','italia':'Italy','espanha':'Spain','portugal':'Portugal','alemanha':'Germany','albania':'Albania','grecia':'Greece','polonia':'Poland','holanda':'Netherlands','paises baixos':'Netherlands','belgica':'Belgium','suica':'Switzerland','austria':'Austria','suecia':'Sweden','noruega':'Norway','finlandia':'Finland','dinamarca':'Denmark','irlanda':'Ireland','hungria':'Hungary','china':'China','japao':'Japan','india':'India','paquistao':'Pakistan','afeganistao':'Afghanistan','coreia do sul':'South Korea','coreia do norte':'North Korea','taiwan':'Taiwan','vietna':'Vietnam','tailandia':'Thailand','indonesia':'Indonesia','filipinas':'Philippines','malasia':'Malaysia','australia':'Australia','nova zelandia':'New Zealand','canada':'Canada','mexico':'Mexico','cuba':'Cuba','venezuela':'Venezuela','colombia':'Colombia','peru':'Peru','chile':'Chile','argentina':'Argentina','uruguai':'Uruguay','paraguai':'Paraguay','bolivia':'Bolivia','equador':'Ecuador','brasil':'Brazil','africa do sul':'South Africa','nigeria':'Nigeria','etiopia':'Ethiopia','quenia':'Kenya','marrocos':'Morocco','sudao':'Sudan','congo':'Dem. Rep. Congo','emirados arabes':'United Arab Emirates','emirados arabes unidos':'United Arab Emirates','catar':'Qatar','cazaquistao':'Kazakhstan','groenlandia':'Greenland','panama':'Panama','haiti':'Haiti','bangladesh':'Bangladesh','mianmar':'Myanmar','singapura':'Singapore','jordania':'Jordan','kuwait':'Kuwait','oma':'Oman','libia':'Libya','argelia':'Algeria','tunisia':'Tunisia','georgia':'Georgia','armenia':'Armenia','azerbaijao':'Azerbaijan','belarus':'Belarus','bielorrussia':'Belarus','moldavia':'Moldova','romenia':'Romania','bulgaria':'Bulgaria','servia':'Serbia','croacia':'Croatia','republica tcheca':'Czechia','tchequia':'Czechia','eslovaquia':'Slovakia'};
function paisEN(d){const en=d.pais_en||PT_EN[norm(d.pais)]||d.pais||'';return norm(en);}
function geoPais(nomeNorm){return GEO.paises.find(p=>norm(p.n)===nomeNorm);}
function centroLL(c){let best=null,area=-1;rings(c).forEach(poly=>{const r=poly[0];let a=0;for(let i=0;i<r.length;i++){const[p,q]=[r[i],r[(i+1)%r.length]];a+=p[0]*q[1]-q[0]*p[1];}if(Math.abs(a)>area){area=Math.abs(a);best=r;}});
  if(!best)return null;let x=0,y=0;best.forEach(p=>{x+=p[0];y+=p[1];});return[x/best.length,y/best.length];}
function llPin(d){ // devolve [lon,lat]
  if(isFinite(+d.lon)&&isFinite(+d.lat)&&(d.lat!==''&&d.lon!==''))return[+d.lon,+d.lat];
  if(d.cidade&&CID[norm(d.cidade)])return CID[norm(d.cidade)];
  if(d.uf&&UF[String(d.uf).toUpperCase()])return UF[String(d.uf).toUpperCase()];
  const p=geoPais(paisEN(d));if(p){const c=centroLL(p.c);if(c)return c;}
  const q=PAIS[norm(d.pais)];if(q)return[q[1],q[0]];return null;}

SCN.globo_mundo=(g,c)=>{
  const dados=(c.dados||[]);const hl=new Set(dados.map(paisEN).filter(Boolean));
  const W=2048,H=1024;
  const tex=texCanvas(W,H,(x)=>{const gr=x.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#15395c');gr.addColorStop(.5,'#1f5582');gr.addColorStop(1,'#15395c');x.fillStyle=gr;x.fillRect(0,0,W,H);
    x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=1;for(let lo=-180;lo<=180;lo+=30){x.beginPath();x.moveTo((lo+180)/360*W,0);x.lineTo((lo+180)/360*W,H);x.stroke();}for(let la=-60;la<=60;la+=30){x.beginPath();x.moveTo(0,(90-la)/180*H);x.lineTo(W,(90-la)/180*H);x.stroke();}
    const P=([lo,la])=>[(lo+180)/360*W,(90-la)/180*H];
    GEO.paises.forEach((p,i)=>{const on=hl.has(norm(p.n));const base=['#6aa35a','#5f9a52','#73ab60','#64a056'][i%4];
      x.fillStyle=on?ORANGE:(norm(p.n)==='antarctica'?'#dfe7ec':base);x.strokeStyle=on?'#ffffff':'#2e5a2c';x.lineWidth=on?2.2:1;
      rings(p.c).forEach(poly=>{x.beginPath();poly.forEach(r=>{r.forEach((pt,k)=>{const[a,b]=P(pt);k?x.lineTo(a,b):x.moveTo(a,b);});x.closePath();});x.fill('evenodd');x.stroke();});});});
  const Rg=6;const tilt=new THREE.Group();tilt.position.y=8;g.add(tilt);const spin=new THREE.Group();tilt.add(spin);
  const globe=new THREE.Mesh(new THREE.SphereGeometry(Rg,96,64),new THREE.MeshStandardMaterial({map:tex,roughness:.85,metalness:0}));spin.add(globe);
  const atm=new THREE.Mesh(new THREE.SphereGeometry(Rg*1.045,64,48),new THREE.MeshBasicMaterial({color:'#6fb7ff',transparent:true,opacity:.13,side:THREE.BackSide}));tilt.add(atm);const amb=new THREE.AmbientLight(0xffffff,.55);g.add(amb);const key=new THREE.DirectionalLight(0xffffff,.6);key.position.set(6,10,18);g.add(key);
  const v3=(lo,la,r)=>{const th=2*Math.PI*(lo+180)/360,ph=(90-la)*Math.PI/180;return new V(-r*Math.cos(th)*Math.sin(ph),r*Math.cos(ph),r*Math.sin(th)*Math.sin(ph));};
  const pins=[];dados.forEach((d,i)=>{if(d.semPino)return;const ll=llPin(d);if(!ll)return;/* um pino por lugar: ignora pino repetido a menos de 1,5° de outro */if(pins.some(q=>Math.hypot(q.ll[0]-ll[0],q.ll[1]-ll[1])<1.5))return;const pn=pin();pn.scale.setScalar(.32);const v=v3(ll[0],ll[1],Rg);pn.position.copy(v);pn.lookAt(v.clone().multiplyScalar(2));pn.rotateX(Math.PI/2);spin.add(pn);
    const ring=new THREE.Mesh(new THREE.RingGeometry(.25,.32,32),new THREE.MeshBasicMaterial({color:ORANGE,transparent:true,side:THREE.DoubleSide,depthWrite:false}));ring.position.copy(v3(ll[0],ll[1],Rg+.02));ring.lookAt(v.clone().multiplyScalar(2));spin.add(ring);pins.push({pn,ring,i,ll});});
  // alvo: média dos pinos
  let tLon=-50,tLat=-10;if(pins.length){let sx=0,sy=0,sz=0;pins.forEach(p=>{const v=v3(p.ll[0],p.ll[1],1);sx+=v.x;sy+=v.y;sz+=v.z;});const m=new V(sx,sy,sz).normalize();tLat=Math.asin(m.y)*180/Math.PI;const th=Math.atan2(m.z,-m.x);tLon=th*180/Math.PI-180;if(tLon<-180)tLon+=360;}
  const thT=2*Math.PI*(tLon+180)/360;const ryT=Math.PI/2-thT;const rxT=clamp(tLat,-55,55)*Math.PI/180;
  const stars=new THREE.Points(new THREE.BufferGeometry().setFromPoints(Array.from({length:500},()=>new V(R(-160,160),R(-40,120),R(-160,-60)))),new THREE.PointsMaterial({color:'#ffffff',size:.45}));g.add(stars);
  return{focus:new V(0,8,0),r:7.2,az:0,globe:true,noShow:true,update:lt=>{const e=ease(clamp(lt/2.6));spin.rotation.y=ryT+(1-e)*1.4+lt*.012;tilt.rotation.x=rxT*e;
    pins.forEach(p=>{const q=clamp((lt-1.6-p.i*.25)/.5);p.pn.scale.setScalar(.32*outBack(q)+.001);const k=((lt*.8+p.i*.3)%1);p.ring.scale.setScalar(1+k*3);p.ring.material.opacity=q*(1-k);});}};};

function mapaReal(g,c,opts){ground(g,'#16304a');const sea=new THREE.GridHelper(260,90,0x2a4c6e,0x223f5d);sea.position.y=.02;g.add(sea);
  const{k,lon0,lat0,foco}=opts;const cl=Math.cos(lat0*Math.PI/180);const XY=([lo,la])=>[(lo-lon0)*cl*k,(la-lat0)*k];
  const hl=new Set((c.dados||[]).map(d=>String(d.uf||'').toUpperCase()).filter(Boolean));
  GEO.uf.forEach((u,i)=>{const main=u.s===foco;const visivel=!foco||main||opts.vizinhos.includes(u.s);if(!visivel)return;
    const on=hl.has(u.s)||(foco&&main);const col=foco?(main?'#e9dcc0':'#4f6f57'):(on?ORANGE:['#6aa84f','#5f9e48','#76b45a','#649f4f','#6fae55'][i%5]);
    rings(u.c).forEach(poly=>{const sh=new THREE.Shape();poly[0].forEach((p,j)=>{const[a,b]=XY(p);j?sh.lineTo(a,b):sh.moveTo(a,b);});
      const depth=foco?(main?1.2:.25):(on?1.6:.6);const geo=new THREE.ExtrudeGeometry(sh,{depth,bevelEnabled:false});geo.rotateX(-Math.PI/2);
      const m=new THREE.Mesh(geo,new THREE.MeshStandardMaterial({color:col,flatShading:true,roughness:.85}));m.castShadow=true;m.receiveShadow=true;g.add(m);
      const ed=new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),new THREE.LineBasicMaterial({color:'#f4f1ea',transparent:true,opacity:foco&&!main?.25:.55}));g.add(ed);});});
  const pins=(c.dados||[]).map((d,i)=>{const ll=llPin(d);if(!ll)return null;const[a,b]=XY(ll);const pn=pin();pn.scale.setScalar(opts.pinS||.8);pn.position.set(a,1.3,-b);g.add(pn);
    const ring=new THREE.Mesh(new THREE.RingGeometry(.6,.8,32),new THREE.MeshBasicMaterial({color:ORANGE,transparent:true,side:THREE.DoubleSide,depthWrite:false}));ring.rotation.x=-Math.PI/2;ring.position.set(a,1.32,-b);g.add(ring);return{pn,ring,i,y:1.3};}).filter(Boolean);
  return lt=>pins.forEach(p=>{const q=clamp((lt-.5-p.i*.3)/.6);p.pn.visible=lt>.5+p.i*.3;p.pn.position.y=p.y+8*(1-outBounce(q));const kk=((lt*.7+p.i*.3)%1);p.ring.scale.setScalar(1+kk*2.5);p.ring.material.opacity=q*(1-kk);});}
SCN.mapa_brasil=(g,c)=>{const up=mapaReal(g,c,{k:.6,lon0:-53,lat0:-15,foco:null,vizinhos:[],pinS:.8});return{focus:new V(0,1,1),r:12.5,az:0,map:true,noShow:true,update:up};};

function jet(col='#8a9099'){const j=new THREE.Group();const f=new THREE.Mesh(new THREE.CylinderGeometry(.32,.22,5,8),M(col));f.rotation.z=-Math.PI/2;j.add(f);
  const n=new THREE.Mesh(new THREE.ConeGeometry(.32,1.3,8),M(col));n.rotation.z=-Math.PI/2;n.position.x=3.1;j.add(n);
  const w=new THREE.Shape();w.moveTo(.8,0);w.lineTo(-1.2,2.6);w.lineTo(-1.8,2.6);w.lineTo(-.9,0);w.lineTo(-1.8,-2.6);w.lineTo(-1.2,-2.6);w.lineTo(.8,0);
  const wg=new THREE.ExtrudeGeometry(w,{depth:.08,bevelEnabled:false});wg.rotateX(Math.PI/2);const wm=new THREE.Mesh(wg,M(shade(col,-.08)));j.add(wm);
  const tf=new THREE.Mesh(new THREE.BoxGeometry(.9,1.1,.08),M(shade(col,-.08)));tf.position.set(-2.1,.6,0);j.add(tf);
  const ex=new THREE.Mesh(new THREE.IcosahedronGeometry(.25,0),MBasic('#ffb238'));ex.position.x=-2.6;j.add(ex);j.traverse(m=>{if(m.isMesh)m.castShadow=true;});return j;}
function drone(){const d=new THREE.Group();const b=new THREE.Mesh(new THREE.BoxGeometry(.7,.18,.7),M('#2b2f36'));d.add(b);[[1,1],[1,-1],[-1,1],[-1,-1]].forEach(([x,z])=>{const a=new THREE.Mesh(new THREE.BoxGeometry(.9,.06,.08),M('#2b2f36'));a.position.set(x*.35,0,z*.35);a.rotation.y=Math.atan2(z,x)*-1;d.add(a);const r=new THREE.Mesh(new THREE.CylinderGeometry(.28,.28,.02,12),MBasic('#6b7480',.6));r.position.set(x*.62,.08,z*.62);d.add(r);});
  const l=new THREE.Mesh(new THREE.IcosahedronGeometry(.07,0),MBasic('#ff4d4d'));l.position.set(0,-.1,.36);d.add(l);return d;}
function missil(){const m=new THREE.Group();const b=new THREE.Mesh(new THREE.CylinderGeometry(.16,.16,2.2,8),M('#d9dde2'));m.add(b);const n=new THREE.Mesh(new THREE.ConeGeometry(.16,.6,8),M('#c0392b'));n.position.y=1.4;m.add(n);
  [0,1,2,3].forEach(i=>{const f=new THREE.Mesh(new THREE.BoxGeometry(.04,.45,.35),M('#7f8c8d'));f.position.y=-.9;f.rotation.y=i*Math.PI/2;f.translateZ(.2);m.add(f);});const fl=new THREE.Mesh(new THREE.ConeGeometry(.2,1,8),MBasic('#ffcf5a'));fl.rotation.x=Math.PI;fl.position.y=-1.6;m.add(fl);return m;}
function burstSys(g){const L=[];const mk=(col,op=1)=>new THREE.MeshBasicMaterial({color:col,transparent:true,opacity:op,depthWrite:false});
  return{add(p,t0,s=1){const fire=new THREE.Mesh(new THREE.IcosahedronGeometry(1,1),mk('#ffb238'));const core=new THREE.Mesh(new THREE.IcosahedronGeometry(.6,1),mk('#fff2b0'));
      const smoke=[0,1,2,3].map(i=>{const m=new THREE.Mesh(new THREE.IcosahedronGeometry(1,0),new THREE.MeshStandardMaterial({color:i%2?'#4a4d52':'#6b6f75',transparent:true,opacity:0,flatShading:true,depthWrite:false}));m.userData.o=new V(R(-.6,.6),0,R(-.6,.6));g.add(m);return m;});
      g.add(fire,core);L.push({p:p.clone(),t0,s,fire,core,smoke});},
    update(lt){L.forEach(b=>{const a=lt-b.t0;const on=a>=0;[b.fire,b.core].forEach(m=>m.visible=on&&a<1.2);if(!on){b.smoke.forEach(m=>m.visible=false);return;}
      const f=clamp(a/.35);b.fire.position.copy(b.p);b.core.position.copy(b.p);b.fire.scale.setScalar(b.s*(.2+2.2*outBack(f)));b.core.scale.setScalar(b.s*(.2+1.4*f));b.fire.material.opacity=1-clamp((a-.3)/.9);b.core.material.opacity=1-clamp((a-.15)/.6);
      b.fire.material.color.set(a<.25?'#ffd36a':'#ff7a2a');
      b.smoke.forEach((m,i)=>{const sa=a-.2-i*.25;m.visible=sa>0;if(sa<=0)return;m.position.set(b.p.x+m.userData.o.x*b.s,b.p.y+sa*1.6*b.s+i*.3,b.p.z+m.userData.o.z*b.s);m.scale.setScalar(b.s*(.8+sa*.7));m.material.opacity=.75*(1-clamp(sa/6));m.rotation.set(sa*.3,sa*.2,0);});});}};}
function cityBlock(g,x0,x1,z0,z1,cols,hmin,hmax,step=7){for(let x=x0;x<=x1;x+=step)for(let z=z0;z<=z1;z+=step){if(rng()<.15)continue;const h=R(hmin,hmax);const w=R(4,6);box(g,w,h,R(4,6),pick(cols),x+R(-.5,.5),0,z+R(-.5,.5));
  if(NIGHT)for(let k=1;k<h/2.6;k++)if(rng()<.55)box(g,w*.8,.35,.08,MBasic(rng()<.7?'#ffd98a':'#9fc3ff'),x,k*2.6,z+3.05,true);}}
function crowd(g,n,cx,cz,w,d,o={}){const L=[];const GP=gradePos(n,cx,cz,w,d);for(let i=0;i<n;i++){const p=person(o.shirts?{shirt:pick(o.shirts)}:{});p.position.set(GP[i][0],0,GP[i][1]);p.rotation.y=(o.face||0)+R(-.25,.25);g.add(p);
  let sg=null;if(o.signs&&rng()<o.signs){sg=new THREE.Group();box(sg,.06,1.4,.06,'#8b6b4a',0,0,0,true);const pl=new THREE.Mesh(new THREE.PlaneGeometry(1,.7),new THREE.MeshStandardMaterial({color:pick(['#ffffff','#f2efe6',ORANGE,'#e5534b','#f2c84b','#3f7fbf']),side:THREE.DoubleSide}));pl.position.y=1.65;sg.add(pl);sg.position.set(.36,1.45,.1);p.add(sg);}
  L.push({p,sg,ph:R(0,6),bx:p.position.x,bz:p.position.z});}return L;}

const tmpV=new V();
function camAt(kind,s,lt,dur,shake=true){
  const p=cine(clamp(lt/Math.max(1,dur))),f=s.focus,r=s.r,az0=s.az||0;
  const D=r/Math.tan(15*Math.PI/180);  // distância para caber ~2r na largura do 9:16
  const place=(az,dist,h)=>{cam.position.set(f.x+Math.sin(az)*dist,f.y+h,f.z+Math.cos(az)*dist);};
  let look=f.clone();
  if(s.globe){const a=kind==='afastamento'?p:1-p;cam.position.set(f.x+Math.sin(lt*.15)*.6,f.y+.6,f.z+14.5+a*12);cam.lookAt(f.x,f.y-.3,f.z);return;}
  if(s.map){const hh={aproximacao:[1.15,.75],afastamento:[.8,1.2],vista_de_cima:[1.25,1.15]}[kind]||[1.05,.9];const dd={aproximacao:[.95,.6],afastamento:[.6,.95]}[kind]||[.7,.65];
    const az=az0+(kind==='orbita'||kind==='sobrevoo'?(-.35+.7*p):0);place(az,D*(dd[0]+(dd[1]-dd[0])*p),D*(hh[0]+(hh[1]-hh[0])*p));cam.lookAt(f);return;}
  switch(kind){
    case 'aproximacao':place(az0,D*(1.35-.4*p),D*(.42-.2*p));break;
    case 'afastamento':place(az0+.15*p,D*(.85+.55*p),D*(.22+.3*p));break;
    case 'sobrevoo':{const ar=(s.azRange??.8)*.75;place(az0-ar+2*ar*p,D*1.05,D*.6);break;}
    case 'mergulho_drone':place(az0+.3*(1-p),D*(.35+.7*p),D*(1.3-1.05*p));break;
    case 'orbita':{const ar=s.azRange??.8;place(az0-ar+2*ar*p,D*1.0,D*.38);break;}
    case 'vista_de_cima':{const a=az0+.3*p;cam.position.set(f.x+Math.sin(a)*D*.15,f.y+D*1.25,f.z+Math.cos(a)*D*.15);break;}
    case 'close_produto':place(az0-.25+.5*p,D*(.55-.08*p),D*.12);break;
    case 'camera_na_mao':place(az0+.05,D*.9,D*.25);break;
    case 'segue_personagem':if(s.hero){const hp=s.hero.getWorldPosition(new V());const fw=new V(Math.sin(s.hero.rotation.y),0,Math.cos(s.hero.rotation.y));
      const back=s.heroD||3.8,hh=s.heroH||2.4;cam.position.copy(hp).addScaledVector(fw,-back).add(new V(-fw.z*.9,hh,fw.x*.9));look=hp.clone().addScaledVector(fw,7).add(new V(0,1.4,0));break;}
    /* sem personagem: vira travelling */
