<title>Motor 3D Bom Dia, Varejo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;0,800;1,500;1,600;1,700&display=swap">
<style>
/* Layout: palco 9:16 (o vídeo) centralizado e controles de revisão embaixo. Em modo render, o palco ocupa a janela inteira. */
:root{
  --bg:#0e1013;--surface:#171a1f;--line:#2a2f37;--fg:#f4f1ea;--muted:#959ca6;
  --accent:#f28c1b;--accent-soft:rgba(242,140,27,.16);
  --font:"Segoe UI","Open Sans",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--font)}
.wrap{min-height:100%;box-sizing:border-box;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding-block:14px 22px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.stage{position:relative;width:min(100%,calc((100vh - 190px)*9/16));width:min(100%,calc((100dvh - 190px)*9/16));
  min-width:min(100%,250px);aspect-ratio:9/16;max-width:100%;border-radius:14px;overflow:hidden;background:#000;container-type:inline-size}
body.render{background:#000}
body.render .wrap{padding:0;gap:0}
body.render .stage{width:100vw;height:100vh;max-width:none;min-width:0;border-radius:0}
body.render .progress,body.render .ctrl,body.render .note{display:none}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.shade{position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(180deg,rgba(0,0,0,.42) 0%,rgba(0,0,0,.18) 16%,rgba(0,0,0,.24) 26%,rgba(0,0,0,0) 38%,rgba(0,0,0,0) 62%,rgba(0,0,0,.3) 72%,rgba(0,0,0,.08) 80%,rgba(0,0,0,.35) 100%)}
.brand{position:absolute;top:4.2cqw;right:4.2cqw;display:flex;align-items:center;gap:2cqw;font-weight:800;font-size:4.1cqw;letter-spacing:-.01em;text-shadow:0 1px 6px rgba(0,0,0,.5)}
.brand svg{width:8.4cqw;height:8.4cqw;border-radius:50%}
.hud{position:absolute;left:5.6cqw;right:5.6cqw;top:30cqw;display:flex;flex-direction:column;gap:.9cqw;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.eyebrow{font-size:2.4cqw;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
.big{font-size:10cqw;line-height:.95;font-weight:800;letter-spacing:-.03em;color:var(--accent);font-variant-numeric:tabular-nums;transform-origin:left center}
.sub{font-size:2.2cqw;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.92}
.ticks{display:flex;gap:1cqw;margin-top:1.3cqw;flex-wrap:wrap;max-width:70cqw}
.ticks i{display:block;width:3.4cqw;height:.6cqw;border-radius:1cqw;background:rgba(255,255,255,.28)}
.ticks i.done{background:rgba(255,255,255,.75)}
.ticks i.on{background:var(--accent)}
.cap{position:absolute;left:8cqw;right:8cqw;top:122cqw;margin:0;text-align:center;font-style:italic;font-weight:600;font-size:4cqw;line-height:1.3;text-wrap:balance;text-shadow:0 2px 12px rgba(0,0,0,.75)}
.cap .w{opacity:0;display:inline-block;transform:translateY(1cqw);transition:opacity .18s ease,transform .18s ease}
.cap .w.on{opacity:1;transform:none}
.cap .w.off{display:none}
.cap .hl{color:var(--accent);font-weight:700;font-size:1.08em}
body.render .cap .w{transition:none}
.src{position:absolute;left:5.6cqw;bottom:24cqw;margin:0;font-size:2.3cqw;font-weight:600;color:rgba(244,241,234,.78);text-shadow:0 1px 6px rgba(0,0,0,.6)}
.dip{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3cqw;background:rgba(12,13,16,.72);opacity:0;pointer-events:none;text-align:center;padding:0 8cqw}
.end svg{width:22cqw;height:22cqw;border-radius:50%}
.end b{font-size:8cqw;font-weight:800;letter-spacing:-.02em}
.end span{font-size:3.8cqw;color:rgba(244,241,234,.85);font-style:italic}
.progress{width:min(100%,calc((100dvh - 190px)*9/16));min-width:min(100%,250px);height:3px;background:var(--line);border-radius:3px;overflow:hidden}
.progress div{height:100%;width:0;background:var(--accent)}
.ctrl{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;max-width:620px}
.ctrl button{font:600 13px/1 var(--font);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:9px 14px;cursor:pointer}
.ctrl button:hover{border-color:#3b414b}
.ctrl button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ctrl .chip{color:var(--muted)}
.ctrl .chip.cur{color:var(--fg);border-color:var(--accent)}
.ctrl .sep{flex-basis:100%;height:0}
.note{font-size:12px;color:var(--muted);max-width:56ch;text-align:center;line-height:1.5;margin:0}
</style>

<main class="wrap">
  <div class="stage" id="stage">
    <canvas id="cv"></canvas>
    <div class="shade"></div>
    <div class="brand"><span>Bom dia, Varejo</span>
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#f28c1b"/><path d="M14 40a18 18 0 0 1 36 0z" fill="#fff"/><rect x="10" y="42" width="44" height="4" rx="2" fill="#fff"/><g stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M32 12v6M17 18l4 4M47 18l-4 4M9 31h5M50 31h5"/></g></svg>
    </div>
    <section class="hud" id="hud">
      <div class="eyebrow" id="eyebrow"></div>
      <div class="big" id="big"></div>
      <div class="sub" id="sub"></div>
      <div class="ticks" id="ticks"></div>
    </section>
    <p class="cap" id="cap"></p>
    <p class="src" id="src"></p>
    <div class="end" id="end">
      <svg viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="32" fill="#f28c1b"/><path d="M14 40a18 18 0 0 1 36 0z" fill="#fff"/><rect x="10" y="42" width="44" height="4" rx="2" fill="#fff"/><g stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M32 12v6M17 18l4 4M47 18l-4 4M9 31h5M50 31h5"/></g></svg>
      <b>Bom dia, Varejo</b>
      <span id="endtxt">Segue o perfil pra saber antes da loja abrir.</span>
    </div>
    <div class="dip" id="dip"></div>
  </div>
  <div class="progress"><div id="prog"></div></div>
  <nav class="ctrl" aria-label="Controles">
    <button id="bPlay" type="button">Pausar</button>
    <button id="bRestart" type="button">Reiniciar</button>
    <span class="sep"></span>
    <span id="chips" style="display:contents"></span>
  </nav>
  <p class="note">Motor do vídeo: lê o JSON do roteiro e monta cada cena com o catálogo 3D. Aqui roda um roteiro de exemplo, sem voz.</p>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
'use strict';
const ORANGE='#f28c1b',RED='#e5534b',GREEN='#3fae6a';
const V=THREE.Vector3;
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const ease=p=>p<.5?2*p*p:1-Math.pow(-2*p+2,2)/2;
const cine=p=>p*.55+(.5-.5*Math.cos(Math.PI*p))*.45;
const outBack=p=>{const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(p-1,3)+c1*Math.pow(p-1,2);};
const outBounce=x=>{const n=7.5625,d=2.75;if(x<1/d)return n*x*x;if(x<2/d)return n*(x-=1.5/d)*x+.75;if(x<2.5/d)return n*(x-=2.25/d)*x+.9375;return n*(x-=2.625/d)*x+.984375;};
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;}}
let rng=mulberry32(1);
const R=(a=0,b=1)=>a+(b-a)*rng();
const pick=a=>a[Math.floor(rng()*a.length)];
const norm=s=>String(s||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().trim();

const SHIRTS=['#ffffff','#e8e4dc','#3f6fb5','#c0392b','#2e8b57','#f2c14e','#6c5b7b','#1f2a36','#8fb3d9','#b5651d'];
const PANTS=['#1f2530','#2d3a4f','#4a3f35','#151515','#6b6f76','#3b4f3a'];
const SKINS=['#f1c9a5','#d9a074','#b47a4e','#8a5a3b','#5e3b26','#e8b98f'];
const HAIRS=['#1b1410','#3b2416','#6b4423','#a07a4a','#2a2a2a','#cfc6b8'];
const GOODS=['#c8a26b','#c8a26b','#b88f58','#d94b3d','#f2c84b','#3f7fbf','#f4f4f2','#6aa84f','#e07b39','#7a4fa0'];
const CARS=['#c0392b','#ecf0f1','#2c3e50','#7f8c8d','#2980b9','#f1c40f','#bdc3c7','#1b1b1b'];
const BRICKS=['#a65e46','#c98b5e','#d9cbb5','#8c6b5a','#b9a68f','#9c4f3d','#cdb89c'];

/* ---------- renderer ---------- */
const stage=document.getElementById('stage'),cv=document.getElementById('cv');
const renderer=new THREE.WebGLRenderer({canvas:cv,antialias:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(2,window.devicePixelRatio||1));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();
const cam=new THREE.PerspectiveCamera(52,9/16,.1,600);
const hemi=new THREE.HemisphereLight(0xe8f1ff,0x6b5f52,.85);
const sun=new THREE.DirectionalLight(0xfff0d8,1.05);
sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-60,right:60,top:60,bottom:-60,near:1,far:260});
sun.shadow.bias=-.0006;
scene.add(hemi,sun,sun.target);
scene.fog=new THREE.Fog(0xbcd6e6,60,190);
function resize(){const r=stage.getBoundingClientRect();if(!r.width)return;renderer.setSize(Math.round(r.width),Math.round(r.height),false);cam.aspect=r.width/r.height;cam.updateProjectionMatrix();}
new ResizeObserver(resize).observe(stage);

const LUZ={
  dia:{sky:'#bcd6e6',fog:[70,200],hemi:[0xe8f1ff,0x6b5f52,.85],sun:[0xfff0d8,1.05,[-30,45,25]]},
  tarde:{sky:'#ecd0ac',fog:[60,180],hemi:[0xffe9cf,0x6b5a4a,.8],sun:[0xffcf96,1.12,[-40,24,14]]},
  noite:{sky:'#101b30',fog:[45,160],hemi:[0x9fb2dd,0x1d1d26,.5],sun:[0xaebfff,.45,[-20,40,10]]},
  interno:{sky:'#d9d3c6',fog:[16,75],hemi:[0xfff8ee,0x7d7466,1.05],sun:[0xfff3e0,.55,[-10,40,12]]},
  estudio:{sky:'#1b1e23',fog:[35,120],hemi:[0xdfe8ff,0x2a2520,.65],sun:[0xffffff,1.0,[-14,30,20]]}
};
let NIGHT=false;

/* ---------- primitivas ---------- */
const MC={};
function M(c){return MC[c]||(MC[c]=new THREE.MeshStandardMaterial({color:c,flatShading:true,roughness:.92,metalness:0}));}
const MB={};function MBasic(c,op){const k=c+'|'+(op||1);return MB[k]||(MB[k]=new THREE.MeshBasicMaterial({color:c,transparent:op<1,opacity:op||1}));}
const GLASS=()=>NIGHT?MBasic('#ffd98a'):M('#35536b');
const WIN=()=>NIGHT?(rng()<.7?MBasic('#ffd98a'):M('#1d2633')):M('#3a4450');
function box(g,w,h,d,c,x,y,z,noShadow){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),typeof c==='string'?M(c):c);m.position.set(x,y+h/2,z);if(!noShadow)m.castShadow=true;m.receiveShadow=true;g.add(m);return m;}
function cyl(g,rt,rb,h,c,x,y,z,seg=8){const m=new THREE.Mesh(new THREE.CylinderGeometry(rt,rb,h,seg),typeof c==='string'?M(c):c);m.position.set(x,y+h/2,z);m.castShadow=true;m.receiveShadow=true;g.add(m);return m;}
function ball(g,r,c,x,y,z,det=0){const m=new THREE.Mesh(new THREE.IcosahedronGeometry(r,det),typeof c==='string'?M(c):c);m.position.set(x,y,z);m.castShadow=true;g.add(m);return m;}
function ground(g,c,size=320){const m=new THREE.Mesh(new THREE.PlaneGeometry(size,size),M(c));m.rotation.x=-Math.PI/2;m.receiveShadow=true;g.add(m);return m;}
function shade(hex,amt){const c=new THREE.Color(hex);c.offsetHSL(0,0,amt);return '#'+c.getHexString();}
function texCanvas(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');draw(x,w,h);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function fitText(x,text,maxW,size,weight){let s=size;do{x.font=`${weight} ${s}px "Open Sans","Segoe UI",sans-serif`;s-=4;}while(x.measureText(text).width>maxW&&s>10);}
function sign(text,w,h,bg,fg,weight=800){
  const W=1024,H=Math.max(64,Math.round(1024*h/w));
  const tex=texCanvas(W,H,(x)=>{if(bg){x.fillStyle=bg;x.fillRect(0,0,W,H);}x.fillStyle=fg;x.textAlign='center';x.textBaseline='middle';fitText(x,text,W*.88,H*.62,weight);x.fillText(text,W/2,H/2+H*.04);});
  return new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({map:tex,transparent:!bg,side:THREE.DoubleSide}));
}
function label(text,color,sw=3.6,sh=1.5){
  const tex=texCanvas(768,320,(x,W,H)=>{x.textAlign='center';x.textBaseline='middle';fitText(x,text,W*.92,H*.7,800);x.lineWidth=14;x.strokeStyle='rgba(0,0,0,.55)';x.strokeText(text,W/2,H/2);x.fillStyle=color;x.fillText(text,W/2,H/2);});
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,transparent:true,depthWrite:false}));s.scale.set(sw,sh,1);return s;
}
function setLabel(s,text,color){const m=s.material;if(m.userData.t===text)return;m.userData.t=text;const old=m.map;
  m.map=texCanvas(768,320,(x,W,H)=>{x.textAlign='center';x.textBaseline='middle';fitText(x,text,W*.92,H*.7,800);x.lineWidth=14;x.strokeStyle='rgba(0,0,0,.55)';x.strokeText(text,W/2,H/2);x.fillStyle=color;x.fillText(text,W/2,H/2);});m.needsUpdate=true;if(old)old.dispose();}

/* ---------- gente, veículos, árvores ---------- */
function person(o={}){
  const shirt=o.shirt||pick(SHIRTS),pants=o.pants||pick(PANTS),skin=o.skin||pick(SKINS),hair=o.hair||pick(HAIRS);
  const g=new THREE.Group(),hip=.9;
  const legs=[-.13,.13].map(x=>{const p=new THREE.Group();p.position.set(x,hip,0);
    const l=new THREE.Mesh(new THREE.BoxGeometry(.2,.88,.22),M(pants));l.position.y=-.44;l.castShadow=true;p.add(l);
    const s=new THREE.Mesh(new THREE.BoxGeometry(.22,.12,.34),M('#26282c'));s.position.set(0,-.86,.05);p.add(s);g.add(p);return p;});
  const torso=new THREE.Mesh(new THREE.BoxGeometry(.56,.74,.3),M(shirt));torso.position.y=hip+.37;torso.castShadow=true;g.add(torso);
  const arms=[-.36,.36].map(x=>{const p=new THREE.Group();p.position.set(x,hip+.68,0);
    const a=new THREE.Mesh(new THREE.BoxGeometry(.15,.62,.17),M(shirt));a.position.y=-.28;a.castShadow=true;p.add(a);
    const h=new THREE.Mesh(new THREE.BoxGeometry(.13,.15,.15),M(skin));h.position.y=-.66;p.add(h);g.add(p);return p;});
  const neck=new THREE.Mesh(new THREE.BoxGeometry(.16,.1,.16),M(skin));neck.position.y=hip+.79;g.add(neck);
  const head=new THREE.Mesh(new THREE.IcosahedronGeometry(.21,0),M(skin));head.scale.set(1,1.18,1.05);head.position.y=hip+1.02;head.castShadow=true;g.add(head);
  const hr=new THREE.Mesh(new THREE.BoxGeometry(.4,.13,.42),M(hair));hr.position.set(0,hip+1.21,-.02);g.add(hr);
  const hb=new THREE.Mesh(new THREE.BoxGeometry(.4,.26,.12),M(hair));hb.position.set(0,hip+1.09,-.19);g.add(hb);
  g.userData={legs,arms,phase:R(0,6)};return g;
}
function animWalk(p,t,rate=1,cart=false){const u=p.userData,s=Math.sin(t*7.2*rate+u.phase);
  u.legs[0].rotation.x=s*.55;u.legs[1].rotation.x=-s*.55;
  if(cart){u.arms[0].rotation.x=-1.15;u.arms[1].rotation.x=-1.15;}else{u.arms[0].rotation.x=-s*.45;u.arms[1].rotation.x=s*.45;}}
function sit(p){p.userData.legs.forEach(l=>l.rotation.x=-1.4);p.position.y=-.35;}
function idle(p,t){const u=p.userData;u.arms[0].rotation.x=Math.sin(t*1.3+u.phase)*.08;u.arms[1].rotation.x=-.2+Math.sin(t*1.7+u.phase)*.15;}
function cart(){const g=new THREE.Group(),c='#b9bec4';box(g,.64,.46,.88,c,0,.42,.3);box(g,.66,.06,.06,'#d9442b',0,1.0,-.18);
  [[-.27,0],[.27,0],[-.27,.62],[.27,.62]].forEach(([x,z])=>{box(g,.05,.42,.05,'#8d939a',x,0,z,true);box(g,.08,.1,.1,'#222',x,0,z,true);});return g;}
function tree(g,x,z,s=1,col){
  cyl(g,.14*s,.2*s,1.9*s,'#6b4f3a',x,0,z,5);
  const c=col||pick(['#4f7d3a','#5b8a40','#476f35','#62913f']);
  const a=ball(g,1.3*s,c,x,2.7*s,z);a.rotation.set(R(0,3),R(0,3),0);a.receiveShadow=true;
  const b=ball(g,.9*s,c,x+.6*s,3.3*s,z-.3*s);b.rotation.set(R(0,3),R(0,3),0);
}
function wheel(g,r,w,x,y,z){const m=new THREE.Mesh(new THREE.CylinderGeometry(r,r,w,10),M('#1d1f22'));m.rotation.z=Math.PI/2;m.position.set(x,y,z);g.add(m);return m;}
function car(g,x,z,rot,col){const c=new THREE.Group();col=col||pick(CARS);
  box(c,1.8,.62,4.1,col,0,.32,0);box(c,1.62,.55,2.1,'#2f3d4c',0,.94,-.25);box(c,1.64,.07,1.9,col,0,1.49,-.25);
  if(NIGHT){box(c,.3,.15,.05,MBasic('#fff6d0'),-.6,.65,2.06,true);box(c,.3,.15,.05,MBasic('#fff6d0'),.6,.65,2.06,true);}
  [[-.9,1.3],[.9,1.3],[-.9,-1.3],[.9,-1.3]].forEach(([wx,wz])=>wheel(c,.34,.26,wx,.34,wz));
  c.position.set(x,0,z);c.rotation.y=rot||0;g.add(c);return c;}
function truck(g,x,z,rot,trailer='#f4f4f2'){const t=new THREE.Group();
  box(t,2.5,3.2,9,trailer,0,1.0,-1.6);box(t,2.52,.45,9.02,ORANGE,0,1.7,-1.6);box(t,2.4,2.5,2.3,'#d9dde2',0,.75,4.3);box(t,2.2,.9,.08,'#2f3d4c',0,2.05,5.46);
  [[-1.1,4.3],[1.1,4.3],[-1.1,-3.8],[1.1,-3.8],[-1.1,-5],[1.1,-5]].forEach(([wx,wz])=>wheel(t,.52,.36,wx,.52,wz));
  t.position.set(x,0,z);t.rotation.y=rot||0;g.add(t);return t;}
function forklift(){const f=new THREE.Group();
  box(f,1.3,1.1,2.2,'#f2b705',0,.3,0);box(f,1.32,.7,.6,'#3a3a3a',0,.5,-1.05);
  [[-.6,-.7],[.6,-.7],[-.6,.7],[.6,.7]].forEach(([x,z])=>box(f,.08,1.6,.08,'#333',x,1.4,z,true));box(f,1.34,.08,1.5,'#333',0,3,0);
  [[-.55,.85],[.55,.85],[-.55,-.85],[.55,-.85]].forEach(([x,z])=>wheel(f,.32,.26,x,.32,z));
  [-.45,.45].forEach(x=>box(f,.12,3.4,.12,'#3a3a3a',x,.2,1.2));
  const d=person({shirt:ORANGE});d.scale.setScalar(.85);d.position.set(0,.85,-.2);d.userData.legs.forEach(l=>l.rotation.x=-1.3);f.add(d);
  const c=new THREE.Group();[-.3,.3].forEach(x=>box(c,.12,.07,1.25,'#2b2b2b',x,0,1.9,true));
  box(c,1.1,.14,1.2,'#b08a5a',0,.07,1.9);box(c,1.0,1.1,1.1,'#c8a26b',0,.21,1.9);f.add(c);f.userData.carriage=c;return f;}
function lamp(g,x,z){box(g,.14,5,.14,'#4a4f57',x,0,z);box(g,.9,.14,.3,NIGHT?MBasic('#ffe7a6'):M('#4a4f57'),x+.4,5,z);}
function bldg(g,x,z,w,h,d,col,face){
  box(g,w,h,d,col,x,0,z);
  const floors=Math.max(1,Math.floor((h-1)/3)),cols=Math.max(1,Math.floor((face==='pz'||face==='nz'?w:d)/2.4));
  for(let f=0;f<floors;f++)for(let c=0;c<cols;c++){
    if(face==='pz'||face==='nz'){const xx=x-w/2+(c+.5)*(w/cols),fz=face==='pz'?z+d/2+.04:z-d/2-.04;box(g,1.0,1.3,.08,WIN(),xx,1.4+f*3,fz,true);}
    else{const zz=z-d/2+(c+.5)*(d/cols),fx=face==='px'?x+w/2+.04:x-w/2-.04;box(g,.08,1.3,1.0,WIN(),fx,1.4+f*3,zz,true);}
  }
  box(g,w+.2,.35,d+.2,shade(col,-.12),x,h,z);
}
function walkerSys(){const list=[];return{list,
  add(g,a,b,speed,o={}){const p=person(o);if(o.cart){const c=cart();c.position.set(0,0,.72);p.add(c);}g.add(p);list.push({p,a:new V(...a),b:new V(...b),speed,off:o.off??R(0,2),cart:!!o.cart,ping:o.ping!==false});return p;},
  update(t){for(const w of list){const len=w.a.distanceTo(w.b)||1;let q=t*w.speed/len+w.off,dir=1;
    if(w.ping){q=q%2;if(q>1){q=2-q;dir=-1;}}else q=q%1;
    w.p.position.lerpVectors(w.a,w.b,q);w.p.rotation.y=Math.atan2((w.b.x-w.a.x)*dir,(w.b.z-w.a.z)*dir);animWalk(w.p,t,w.speed/1.3,w.cart);}}};}

/* ---------- câmeras ---------- */
const tmpV=new V();
function camAt(kind,s,lt,dur,shake=true){
  const p=cine(clamp(lt/Math.max(1,dur))),f=s.focus,r=s.r,az0=s.az||0;
  const D=r/Math.tan(15*Math.PI/180);  // distância para caber ~2r na largura do 9:16
  const place=(az,dist,h)=>{cam.position.set(f.x+Math.sin(az)*dist,f.y+h,f.z+Math.cos(az)*dist);};
  let look=f.clone();
  switch(kind){
    case 'aproximacao':place(az0,D*(1.35-.4*p),D*(.42-.2*p));break;
    case 'afastamento':place(az0+.15*p,D*(.85+.55*p),D*(.22+.3*p));break;
    case 'sobrevoo':place(az0-.6+1.2*p,D*1.05,D*.6);break;
    case 'mergulho_drone':place(az0+.3*(1-p),D*(.35+.7*p),D*(1.3-1.05*p));break;
    case 'orbita':place(az0-.8+1.6*p,D*1.0,D*.38);break;
    case 'vista_de_cima':{const a=az0+.3*p;cam.position.set(f.x+Math.sin(a)*D*.15,f.y+D*1.25,f.z+Math.cos(a)*D*.15);break;}
    case 'close_produto':place(az0-.25+.5*p,D*(.55-.08*p),D*.12);break;
    case 'camera_na_mao':place(az0+.05,D*.9,D*.25);break;
    case 'segue_personagem':if(s.hero){const hp=s.hero.getWorldPosition(new V());const fw=new V(Math.sin(s.hero.rotation.y),0,Math.cos(s.hero.rotation.y));
      const back=s.heroD||3.8,hh=s.heroH||2.4;cam.position.copy(hp).addScaledVector(fw,-back).add(new V(-fw.z*.9,hh,fw.x*.9));look=hp.clone().addScaledVector(fw,7).add(new V(0,1.4,0));break;}
    /* sem personagem: vira travelling */
    case 'travelling_lateral':default:{const side=new V(Math.cos(az0),0,-Math.sin(az0));const off=(-1+2*p)*r*.7;place(az0,D*.95,D*.3);cam.position.addScaledVector(side,off);look=f.clone().addScaledVector(side,off*.4);}
  }
  if(kind!=='vista_de_cima'){const t=lt;const k=kind==='camera_na_mao'?1:(shake?.25:0);cam.position.x+=Math.sin(t*1.7)*.06*k*r/5;cam.position.y+=Math.sin(t*2.3+1)*.05*k*r/5;}
  if(cam.position.y<.6)cam.position.y=.6;
  cam.lookAt(look);
}

    const objUpd=[];if(!s.noShow&&(c3.objetos||[]).length){const base=s.show||s.focus.clone().setY(0);const sc=clamp(s.r*.12,.9,3.2);const n=Math.min(4,c3.objetos.length);
      c3.objetos.slice(0,4).forEach((nm,k)=>{const o=makeObj(nm);if(!o)return;const holder=new THREE.Group();holder.add(o);o.scale.setScalar(sc);const x=base.x+(k-(n-1)/2)*sc*1.7,y=base.y+.15,z=base.z;holder.position.set(x,y,z);g.add(holder);
        const ring=new THREE.Mesh(new THREE.RingGeometry(.55*sc,.65*sc,32),new THREE.MeshBasicMaterial({color:ORANGE,side:THREE.DoubleSide,transparent:true,opacity:.9}));ring.rotation.x=-Math.PI/2;ring.position.set(x,base.y+.06,z);g.add(ring);

    const fx=(FX[fxKind]||FX.nenhum)(g,{p:fxP,base:s.globe?0:fxBase,u,r:s.r,c:Object.assign({},ctx)});

let words=[],wordTimes=[];
function setCaption(s){
  cap.textContent='';const md=String(s.c.narracao||'');
  md.split(/(\*\*[^*]+\*\*)/).filter(Boolean).forEach(part=>{const hl=part.startsWith('**');const txt=hl?part.slice(2,-2):part;
    txt.split(/(\s+)/).forEach(w=>{if(!w)return;if(/^\s+$/.test(w)){cap.appendChild(document.createTextNode(' '));return;}const sp=document.createElement('span');sp.className='w'+(hl?' hl':'');sp.textContent=w;cap.appendChild(sp);});});
  words=[...cap.querySelectorAll('.w')];
  // tempo de cada palavra: por frase, se a quantidade de frases bate com a fala; senão, pela cena inteira
  const capS=sentences(md),pause=(+s.c.pausa_depois_ms||300)/1000;
  let spans;if(s.speech&&s.speech.length===capS.length)spans=s.speech.map(f=>[f.inicio,f.fim]);
  else if(s.speech)spans=[[s.speech[0].inicio,s.speech[s.speech.length-1].fim]];
  else spans=[[s.start+.25,Math.max(s.start+.6,s.end-pause)]];
  const groups=spans.length===capS.length?capS.map(x=>x.split(/\s+/).filter(Boolean).length):[words.length];
  wordTimes=[];let wi=0;groups.forEach((n,gi)=>{const [a,b]=spans[gi];const ws=words.slice(wi,wi+n);const lens=ws.map(w=>w.textContent.length+1);const tot=lens.reduce((x,y)=>x+y,0)||1;let acc=0;ws.forEach((w,k)=>{wordTimes.push(a+(b-a)*acc/tot);acc+=lens[k];});wi+=n;});

}
function enter(i){
  SC.forEach((s,j)=>{s.g.visible=j===i;if(s.chip)s.chip.classList.toggle('cur',j===i);});
  const s=SC[i],e=s.env;
  scene.background=new THREE.Color(e.sky);scene.fog.color.set(e.sky);scene.fog.near=e.fog[0];scene.fog.far=e.fog[1];
  hemi.color.set(e.hemi[0]);hemi.groundColor.set(e.hemi[1]);hemi.intensity=e.hemi[2];
  sun.color.set(e.sun[0]);sun.intensity=e.sun[1];sun.position.set(s.focus.x+e.sun[2][0],e.sun[2][1],s.focus.z+e.sun[2][2]);sun.target.position.set(s.focus.x,0,s.focus.z);
  const h=s.c.hud;
  if(h){eyebrow.textContent=h.chapeu||'';big.textContent=h.destaque||'';sub.textContent=h.apoio||'';big.hidden=!h.destaque;}
  else if(s.c.tipo==='abertura'){const d=ROT.data?new Date(ROT.data+'T12:00:00'):null;eyebrow.textContent=MODE_LABEL[ROT.modo]||'Bom dia, Varejo';big.textContent=d?String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0'):'';sub.textContent=d?WEEK[d.getDay()]:'';big.hidden=!d;}
  else{eyebrow.textContent='';big.textContent='';sub.textContent='';big.hidden=true;}
  hud.hidden=s.c.tipo==='fechamento';
  src.textContent=s.c.fonte||'';setCaption(s);
  let k=0;const tk=[...ticks.children];SC.forEach((x,j)=>{if(!x.c.hud)return;if(tk[k])tk[k].className=j<i?'done':j===i?'on':'';k++;});
  cur=i;
}
function sceneAt(time){for(let i=SC.length-1;i>=0;i--)if(time>=SC[i].start)return i;return 0;}
function renderFrame(){
  if(!SC.length)return;
  const i=sceneAt(t);if(i!==cur)enter(i);
  const s=SC[i],lt=t-s.start,dur=s.end-s.start;
  const e=s.env,Dc=s.r/Math.tan(15*Math.PI/180);scene.fog.near=Math.max(e.fog[0],Dc*.9);scene.fog.far=Math.max(e.fog[1],Dc*2.6);
  s.update(lt);s.objUpd.forEach(f=>f(lt));s.fx(lt);
  camAt(s.c3.camera,s,lt,dur);
  const bq=clamp((lt-.15)/.45);big.style.transform=`scale(${(.8+.2*outBack(bq)).toFixed(3)})`;big.style.opacity=bq.toFixed(2);
  const CH=5;let n=0;for(let k=0;k<wordTimes.length;k++)if(t>=wordTimes[k])n=k+1;const chunk=Math.floor((Math.max(1,n)-1)/CH);

  let d=Infinity;SC.forEach(x=>d=Math.min(d,Math.abs(t-x.start)));d=Math.min(d,Math.abs(TOTAL-t));
  dip.style.opacity=clamp(1-d/.2).toFixed(3);
  end.style.opacity=s.c.tipo==='fechamento'?clamp((lt-.2)/.5).toFixed(3):'0';

function frame(now){const dt=Math.min(.05,(now-last)/1000);last=now;if(playing&&SC.length){t+=dt;if(t>=TOTAL){t=0;cur=-1;}}renderFrame();requestAnimationFrame(frame);}
